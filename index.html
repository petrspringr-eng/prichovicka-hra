<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Příchovická hra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1 id="gameTitle">Příchovická hra</h1>
</header>

<main>

    <section id="homeScreen">

        <div id="teamSetup">
            <h2>Vyberte svůj tým</h2>

            <select id="teamSelect">
                <option>Držky forever</option>
                <option>Coury nejen z Plzně</option>
                <option>Tajemství Božáku</option>
                <option>Panda friends</option>
                <option>Bobři</option>
                <option>Jeleni</option>
            </select>

            <button id="startButton">
                Začít hru
            </button>
        </div>

        <div id="dashboard" style="display:none;">

            <h2 id="teamName"></h2>

            <div class="scoreBox">
                <span>⭐ Body</span>
                <strong id="scoreValue">0</strong>
            </div>

            <div class="scoreBox">
                <span>✅ Splněno</span>
                <strong id="completedValue">0 / 20</strong>
            </div>

            <h3>Získané stránky deníku</h3>

            <div id="storyList">
                Zatím žádné.
            </div>

            <p class="instruction">
                📱 Najděte stanoviště v terénu a naskenujte jeho QR kód.
            </p>

            <button id="changeTeamButton" class="secondaryButton">
                Změnit tým / reset
            </button>

        </div>

        <p class="adminLink">
            <a href="#" id="adminLogin">
                Organizátor
            </a>
        </p>

    </section>

    <section id="gameScreen" style="display:none;">

        <p id="testBanner" class="testBanner" style="display:none;">
            🧪 TESTOVACÍ REŽIM
        </p>

        <h2 id="stationTitle"></h2>

        <p id="stationQuestion" class="question"></p>

        <div id="answers"></div>

        <button id="submitAnswer">
            Odeslat
        </button>

        <div id="result"></div>

        <button id="backButton" class="secondaryButton">
            Zpět na přehled
        </button>

    </section>

    <section id="adminScreen" style="display:none;">

        <h2>👑 Organizátor</h2>

        <p>
            Kliknutím na číslo stanoviště simuluješ jeho QR kód.
            V testovacím režimu se nic neukládá.
        </p>

        <div id="stationList"></div>

        <button id="closeAdmin" class="secondaryButton">
            Zavřít organizátora
        </button>

    </section>

</main>

<script src="gameData.js"></script>
<script src="game.js"></script>

</body>
</html>
